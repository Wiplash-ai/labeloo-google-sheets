<style>
:root {
  color-scheme: light;
  --ink: #16201f;
  --ink-soft: #41504d;
  --paper: #fffef9;
  --canvas: #e9ebe7;
  --panel: #f5f4ee;
  --line: #ced3cd;
  --line-strong: #98a39f;
  --teal: #087f78;
  --teal-dark: #075e5a;
  --teal-wash: #d9efeb;
  --gold: #d8a327;
  --gold-wash: #fff1bd;
  --danger: #a33733;
}

* { box-sizing: border-box; }

html, body { margin: 0; min-height: 100%; }

body,
button,
input,
select {
  font-family: "Trebuchet MS", "Avenir Next", sans-serif;
}

body {
  background:
    linear-gradient(rgba(22, 32, 31, .035) 1px, transparent 1px) 0 0 / 100% 24px,
    var(--canvas);
  color: var(--ink);
  font-size: 13px;
}

button, input, select { font: inherit; }
button, select { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
  outline: 3px solid rgba(8, 127, 120, .24);
  outline-offset: 2px;
}

.hidden { display: none !important; }

.masthead {
  position: sticky;
  z-index: 10;
  top: 0;
  display: grid;
  grid-template-columns: 48px 1fr;
  align-items: center;
  gap: 11px;
  min-height: 82px;
  padding: 13px 14px;
  border-bottom: 3px solid var(--gold);
  background: var(--ink);
  color: var(--paper);
  box-shadow: 0 8px 26px rgba(22, 32, 31, .16);
}

.brand-mark { width: 48px; height: 48px; }
.brand-mark svg { display: block; width: 100%; height: 100%; }
.kicker { margin: 0 0 3px; color: #8dc9bd; font-size: 9px; font-weight: 900; letter-spacing: .16em; }
.masthead h1 { margin: 0; font: 700 21px/1.05 Georgia, serif; }

main { display: grid; gap: 9px; padding: 10px 9px 132px; }

section {
  position: relative;
  overflow: hidden;
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--paper);
  box-shadow: 0 8px 24px rgba(27, 37, 35, .06);
}

section::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: var(--teal);
}

.section-heading {
  display: grid;
  grid-template-columns: 27px minmax(0, 1fr);
  align-items: center;
  gap: 8px;
  margin-bottom: 11px;
}

.section-heading--split { grid-template-columns: 27px minmax(0, 1fr) auto; }
.section-heading p { margin: 0 0 1px; color: #75817e; font-size: 9px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
h2 { margin: 0; font: 700 17px/1.12 Georgia, serif; }
.step-number { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 4px; background: var(--ink); color: var(--gold-wash); font: 700 12px Georgia, serif; }
.count-badge { padding: 4px 6px; border-radius: 999px; background: var(--teal-wash); color: var(--teal-dark); font-size: 9px; font-weight: 900; white-space: nowrap; }

.field { display: grid; gap: 5px; min-width: 0; }
.field > span, legend { color: #5b6966; font-size: 10px; font-weight: 900; }
input, select {
  width: 100%;
  min-width: 0;
  height: 35px;
  padding: 0 9px;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  background: white;
  color: var(--ink);
}

.custom-range { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 6px; margin-top: 8px; }
.range-ticket { margin-top: 10px; padding: 10px; display: grid; gap: 2px; border: 1px dashed var(--line-strong); border-radius: 5px; background: var(--panel); }
.range-ticket span { color: var(--ink-soft); font-size: 10px; }
.range-ticket strong { font: 700 20px/1 Georgia, serif; color: var(--teal-dark); }
.range-ticket small { color: #6d7976; font-size: 10px; }
.text-button { margin: 8px 0 -2px; padding: 0; border: 0; background: none; color: var(--teal-dark); font-size: 10px; font-weight: 900; }

.orientation { margin: 0 0 10px; padding: 0; border: 0; }
.orientation legend { margin-bottom: 5px; }
.segmented { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 5px; background: var(--canvas); }
.segmented button { height: 31px; border: 0; border-radius: 3px; background: transparent; color: var(--ink-soft); font-weight: 900; }
.segmented button.selected { background: var(--ink); color: var(--paper); box-shadow: 0 3px 9px rgba(22,32,31,.16); }
.structure-grid { display: grid; gap: 8px; }

.mapping-list { display: grid; gap: 7px; }
.mapping-row { padding: 8px; display: grid; gap: 7px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); }
.mapping-source { display: grid; grid-template-columns: 24px minmax(0, 1fr); align-items: center; gap: 7px; }
.column-reference { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 4px; background: var(--gold-wash); color: #705111; font: 700 12px Georgia, serif; }
.mapping-source strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
.mapping-source small { display: block; margin-top: 2px; overflow: hidden; color: #75817e; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
.mapping-row select { height: 31px; font-size: 11px; }

.preview-list { display: grid; gap: 6px; }
.preview-label { position: relative; min-height: 54px; padding: 9px 9px 9px 35px; border: 1px solid var(--line); border-radius: 4px; background: white; }
.preview-label::before { content: attr(data-index); position: absolute; inset: 0 auto 0 0; width: 27px; display: grid; place-items: center; background: var(--teal-wash); color: var(--teal-dark); font: 700 11px Georgia, serif; }
.preview-label strong, .preview-label span { display: block; font-size: 10px; line-height: 1.35; }
.preview-label strong { font-size: 11px; }
.preview-more { margin: 0; padding: 6px; color: #66736f; font-size: 10px; text-align: center; }
.message { min-height: 14px; margin: 8px 0 0; color: var(--danger); font-size: 10px; line-height: 1.35; }

.connection { border-color: #8dbdb5; background: linear-gradient(145deg, var(--paper), var(--teal-wash)); }
.connection::before { background: var(--gold); }
.connection-copy > p:not(.kicker) { margin: 6px 0 10px; color: var(--ink-soft); font-size: 10px; line-height: 1.45; }
.connection-actions { display: flex; align-items: center; gap: 8px; }
.connection-actions .button { width: 100%; }
.connection-account { margin: 0 0 8px; padding: 8px; border-radius: 4px; background: rgba(255,255,255,.7); font-size: 10px; }
.connection-code { margin-top: 9px; padding: 9px; border: 1px solid var(--gold); border-radius: 5px; background: var(--gold-wash); color: #604610; font-size: 10px; text-align: center; }
.connection-code strong { display: block; margin-top: 3px; font: 700 20px/1 Georgia, serif; letter-spacing: .11em; }

.button { min-height: 35px; padding: 0 11px; border: 0; border-radius: 4px; font-weight: 900; }
.button--primary { background: var(--teal); color: white; box-shadow: 0 6px 14px rgba(8,127,120,.22); }
.button--primary:hover { background: var(--teal-dark); }
.button--primary:disabled { cursor: not-allowed; background: #83908d; box-shadow: none; }
.button--quiet { border: 1px solid var(--line-strong); background: white; color: var(--ink); }
.button--small { min-height: 29px; padding: 0 8px; font-size: 10px; }

.action-dock {
  position: fixed;
  z-index: 20;
  right: 0;
  bottom: 0;
  left: 0;
  padding: 8px 9px 10px;
  border-top: 3px solid var(--gold);
  background: rgba(22, 32, 31, .97);
  color: var(--paper);
  box-shadow: 0 -9px 28px rgba(22,32,31,.2);
}
.action-dock p { min-height: 13px; margin: 0 0 5px; color: #b9c7c3; font-size: 9px; text-align: center; }
.action-dock .button { width: 100%; min-height: 43px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-family: Georgia, serif; font-size: 15px; }
.fallback-link { display: block; margin: 0 0 6px; color: var(--gold-wash); font-size: 10px; text-align: center; }
.product-links { display: flex; justify-content: center; gap: 12px; margin-top: 8px; }
.product-links a { color: #c8d4d1; font-size: 9px; font-weight: 900; text-decoration-thickness: 1px; text-underline-offset: 2px; }
.product-links a:hover { color: var(--gold-wash); }

@media (prefers-reduced-motion: no-preference) {
  section { animation: rise .28s ease both; }
  section:nth-child(2) { animation-delay: .04s; }
  section:nth-child(3) { animation-delay: .08s; }
  section:nth-child(4) { animation-delay: .12s; }
  @keyframes rise { from { opacity: 0; transform: translateY(7px); } }
}
</style>
